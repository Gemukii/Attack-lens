[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "attacklens"
version = "0.1.0"
description = "Local attack surface and attack path analyzer for hosts and Docker environments."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
{ name = "AttackLens Contributors" }
]

dependencies = [
"psutil>=7.0,<8.0",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
"pytest>=8.0,<9.0",
"ruff>=0.12,<1.0",
]

[project.scripts]
attacklens = "attacklens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
