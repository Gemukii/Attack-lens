[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "attacklens"
version = "0.1.0"
description = "Local attack surface and attack path analyzer for hosts and Docker environments."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
{ name = "AttackLens Contributors" }
]

dependencies = [
    "psutil>=7.0,<8.0",
    "fastapi>=0.141,<1.0",
    "uvicorn>=0.53,<1.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
"pytest>=9.0.3,<10.0",
"httpx2>=0.1",
"ruff>=0.16,<0.18",
]

[project.scripts]
attacklens = "attacklens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
