services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attacklens-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp
    environment:
      ATTACKLENS_DEFAULT_TARGET: ${ATTACKLENS_DEFAULT_TARGET:-host.docker.internal}
      ATTACKLENS_INVENTORY_SCOPE: container
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - attacklens-results:/app/results
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attacklens-dashboard
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
      API_INTERNAL_BASE: ${API_INTERNAL_BASE}
      NUXT_PUBLIC_SCAN_TARGET: ${ATTACKLENS_DEFAULT_TARGET:-host.docker.internal}
    depends_on:
      api:
        condition: service_healthy

volumes:
  attacklens-results: