services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attacklens-api
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attacklens-dashboard
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
      API_INTERNAL_BASE: ${API_INTERNAL_BASE}
    depends_on:
      - api