services:
  api:
    # Always run the current code: a stale image breaks on a newer configuration.
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attacklens-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp
    environment:
      ATTACKLENS_DEFAULT_TARGET: ${ATTACKLENS_DEFAULT_TARGET:-host.docker.internal}
      ATTACKLENS_INVENTORY_SCOPE: container
      ATTACKLENS_DB_PATH: /app/data/attacklens.db
      ATTACKLENS_RESULTS_DIR: /app/results
      ATTACKLENS_CORS_ORIGINS: ${ATTACKLENS_CORS_ORIGINS:-http://localhost:3000}
      ATTACKLENS_API_KEY: ${ATTACKLENS_API_KEY:-}
      ATTACKLENS_ALLOWED_TARGETS: ${ATTACKLENS_ALLOWED_TARGETS:-}
      ATTACKLENS_ENABLE_OSV: ${ATTACKLENS_ENABLE_OSV:-false}
      ATTACKLENS_ALERT_WEBHOOK_URL: ${ATTACKLENS_ALERT_WEBHOOK_URL:-}
      ATTACKLENS_ALERT_MIN_SEVERITY: ${ATTACKLENS_ALERT_MIN_SEVERITY:-low}
      ATTACKLENS_AGENT_SILENCE_SECONDS: ${ATTACKLENS_AGENT_SILENCE_SECONDS:-300}
      ATTACKLENS_RETENTION_DAYS: ${ATTACKLENS_RETENTION_DAYS:-365}
      ATTACKLENS_AUDIT_MODE: ${ATTACKLENS_AUDIT_MODE:-false}
      ATTACKLENS_BACKUP_DIR: /app/backups
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The API owns the database. A named volume keeps SQLite locking reliable.
      - attacklens-data:/app/data
      # Only read once, to import JSON results written by earlier versions.
      - ./results:/app/results:ro
      # On the host, so that backups survive `docker compose down -v`.
      - ./backups:/app/backups
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    pull_policy: build
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attacklens-dashboard
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp
    environment:
      NUXT_API_INTERNAL_BASE: http://api:8000
      NUXT_API_KEY: ${ATTACKLENS_API_KEY:-}
      NUXT_DASHBOARD_PASSWORD: ${ATTACKLENS_DASHBOARD_PASSWORD:-}
      NUXT_PUBLIC_SCAN_TARGET: ${ATTACKLENS_DEFAULT_TARGET:-host.docker.internal}
    depends_on:
      api:
        condition: service_healthy

volumes:
  attacklens-data:
